<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }
    .posts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .post-card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }
    .post-card:hover {
      transform: translateY(-5px);
    }
    .post-title {
      font-size: 1.2em;
      margin-bottom: 8px;
      color: #333;
      font-weight: bold;
    }
    .post-content {
      font-size: 0.95em;
      color: #555;
      margin-bottom: 12px;
    }
    .tags {
      margin-bottom: 12px;
    }
    .tag {
      display: inline-block;
      background: #eee;
      color: #333;
      font-size: 0.8em;
      padding: 4px 8px;
      border-radius: 6px;
      margin-right: 6px;
    }
    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85em;
      color: #777;
    }
    .icons {
      display: flex;
      gap: 10px;
    }
    .icons span {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Posts</h1>
  <div class="posts-container" id="postsContainer"></div>

  <script>
    const container = document.getElementById("postsContainer");

    async function getPosts() {
      const response = await fetch("https://dummyjson.com/posts");
      const data = await response.json();
      const posts = data.posts;

      posts.forEach(post => {
        const card = document.createElement("div");
        card.className = "post-card";

        // shorten body text to first 150 chars
        const shortBody = post.body.length > 150 
          ? post.body.substring(0, 150) + "..." 
          : post.body;

        card.innerHTML = `
          <div class="post-title">${post.title}</div>
          <div class="post-content">${shortBody}</div>
          <div class="tags">
            ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join(" ")}
          </div>
          <div class="post-footer">
            <div class="icons">
              <span>👍 ${post.reactions.likes}</span>
               <span>dis ${post.reactions.dislikes}</span>
            </div>
            <div>👁 ${Math.floor(Math.random() * 500) + 50}</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    getPosts();
  </script>
</body>
</html>
